services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: market-gap-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INNGEST_BASE_URL=http://inngest:8288
      # Dockerボリュームマウント時・WSL2/Windows環境におけるHot Reload (Fast Refresh) の確実な検知
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env.local
    volumes:
      # ソースコードをホストと双方向マウント（リアルタイムコード同期）
      - .:/app
      # ホスト側の node_modules でコンテナ内を上書きしないよう匿名ボリュームで保護
      - /app/node_modules
      # Next.js のキャッシュとビルド成果物を保護・高速化
      - /app/.next
    command: npm run dev -- -H 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Inngestローカル開発サーバー（バックグラウンドジョブ検証用UI: http://localhost:8288）
  inngest:
    image: inngest/inngest:latest
    container_name: market-gap-inngest
    restart: unless-stopped
    ports:
      - "8288:8288"
    environment:
      - INNGEST_DEV_SERVER_PORT=8288
      - INNGEST_DEV_SERVER_HOST=0.0.0.0
    command: inngest dev -u http://app:3000/api/inngest --host 0.0.0.0 --port 8288
    depends_on:
      - app
